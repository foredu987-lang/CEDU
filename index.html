let allExpanded = false;

// 渲染題目的函數
function renderQuestions(data) {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    // 更新總題數顯示
    const countSpan = document.getElementById('total-count');
    if (countSpan) countSpan.innerText = data.length;

    data.forEach((item, index) => {
        // 頻率標籤顏色邏輯
        let badgeColor = "bg-gray-100 text-gray-800";
        if(item.frequencyValue === 3) badgeColor = "bg-red-100 text-red-700 border-red-200";
        if(item.frequencyValue === 2) badgeColor = "bg-yellow-100 text-yellow-700 border-yellow-200";
        if(item.frequencyValue === 1) badgeColor = "bg-green-100 text-green-700 border-green-200";

        // 選項 HTML 組合
        const optionsHtml = item.options.map(opt => 
            `<div class="p-3 bg-gray-50 border border-gray-100 rounded-lg hover:bg-blue-50 transition">${opt}</div>`
        ).join('');

        const cardHTML = `
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 hover:shadow-md transition">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-3">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-sm">
                            ${item.no}
                        </span>
                        <span class="text-sm font-medium px-3 py-1 bg-gray-100 rounded-full text-gray-600">${item.category}</span>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-md border ${badgeColor}">
                        出題頻率：${item.frequencyLabel} (${item.frequencyValue})
                    </span>
                </div>
                
                <h3 class="text-lg font-semibold text-gray-800 mb-4 leading-relaxed">
                    ${item.question}
                </h3>
                
                <div class="space-y-2 mb-6">
                    ${optionsHtml}
                </div>

                <div class="border-t border-gray-100 pt-4">
                    <button onclick="toggleAnswer('ans-${item.id}', 'btn-text-${item.id}')" class="text-blue-600 hover:text-blue-800 font-medium text-sm flex items-center gap-2">
                        <i class="fas fa-lightbulb"></i> <span id="btn-text-${item.id}">顯示解答與解析</span>
                    </button>
                    
                    <div id="ans-${item.id}" class="answer-reveal bg-green-50 rounded-lg border border-green-100 px-4">
                        <p class="font-bold text-green-800 mb-2 mt-2">正確解答：${item.answer}</p>
                        <p class="text-green-900 text-sm leading-relaxed pb-4"><span class="font-bold">解析：</span>${item.explanation}</p>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += cardHTML;
    });
}

// 答案切換功能
function toggleAnswer(id, btnId) {
    const el = document.getElementById(id);
    const btnText = document.getElementById(btnId);
    if (el.classList.contains('show')) {
        el.classList.remove('show');
        btnText.innerText = '顯示解答與解析';
    } else {
        el.classList.add('show');
        btnText.innerText = '隱藏解答與解析';
    }
}

// 全部展開/隱藏邏輯
document.addEventListener('DOMContentLoaded', () => {
    const expandAllBtn = document.getElementById('expand-all-btn');
    if (expandAllBtn) {
        expandAllBtn.addEventListener('click', () => {
            allExpanded = !allExpanded;
            const ansDivs = document.querySelectorAll('.answer-reveal');
            const btnTexts = document.querySelectorAll('[id^="btn-text-"]');
            
            if (allExpanded) {
                ansDivs.forEach(div => div.classList.add('show'));
                btnTexts.forEach(btn => btn.innerText = '隱藏解答與解析');
                expandAllBtn.innerText = '隱藏全部解析';
                expandAllBtn.classList.replace('bg-blue-100', 'bg-gray-200');
                expandAllBtn.classList.replace('text-blue-700', 'text-gray-800');
            } else {
                ansDivs.forEach(div => div.classList.remove('show'));
                btnTexts.forEach(btn => btn.innerText = '顯示解答與解析');
                expandAllBtn.innerText = '展開全部解析';
                expandAllBtn.classList.replace('bg-gray-200', 'bg-blue-100');
                expandAllBtn.classList.replace('text-gray-800', 'text-blue-700');
            }
        });
    }
});

// 分類篩選功能
function filterCategory(category) {
    if (category === 'all') {
        renderQuestions(questionsData);
    } else {
        const filtered = questionsData.filter(q => q.category === category);
        renderQuestions(filtered);
    }
}

// 初始化渲染
window.onload = () => {
    renderQuestions(questionsData);
};
