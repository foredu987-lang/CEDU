                explanation: '「消弱」是指對於原先受到增強的不當行為（如作怪以吸引老師注意），故意不給予任何反應（忽視），久而久之，該行為因為得不到增強而逐漸消失。'
            },
            {
                id: 11050,
                year: 110,
                no: 50,
                category: '教學與評量',
                frequencyLabel: '高',
                frequencyValue: 3,
                question: '在布魯姆(Bloom)的認知領域教學目標修訂版中，將知識向度分為四類：事實性知識、概念性知識、程序性知識，以及下列何者？',
                options: ['(A) 理論性知識', '(B) 實用性知識', '(C) 後設認知知識 (Metacognitive Knowledge)', '(D) 道德性知識'],
                answer: 'C',
                explanation: 'Anderson 修訂版將知識向度擴充為四類：事實性(基本元素)、概念性(結構與關係)、程序性(如何做)、以及後設認知知識(對自身認知的覺察與策略運用)。'
            }
        ];

        // 取得 DOM 元素
        const container = document.getElementById('questionContainer');
        const sortSelect = document.getElementById('sortSelect');
        const filterSelect = document.getElementById('filterSelect');
        const expandAllBtn = document.getElementById('expandAllBtn');
        let allExpanded = false;

        // 渲染題庫函數
        function renderQuestions() {
            const sortMode = sortSelect.value;
            const filterMode = filterSelect.value;

            // 1. 篩選
            let filteredData = questionsData.filter(q => {
                if (filterMode === 'all') return true;
                return q.category === filterMode;
            });

            // 2. 排序
            filteredData.sort((a, b) => {
                if (sortMode === 'frequency') {
                    // 頻率高到低，頻率相同則比年份新到舊，再比題號小到大
                    if (b.frequencyValue !== a.frequencyValue) {
                        return b.frequencyValue - a.frequencyValue;
                    }
                    if (b.year !== a.year) {
                        return b.year - a.year;
                    }
                    return a.no - b.no;
                } else if (sortMode === 'year') {
                    // 年份新到舊，年份相同比題號小到大
                    if (b.year !== a.year) {
                        return b.year - a.year;
                    }
                    return a.no - b.no;
                }
            });

            // 3. 生成 HTML
            container.innerHTML = '';
            
            if (filteredData.length === 0) {
                container.innerHTML = '<div class="text-center p-8 text-gray-500 bg-white rounded-xl">找不到符合條件的題目。</div>';
                return;
            }

            filteredData.forEach(q => {
                // 決定頻率標籤顏色
                let freqColor = 'bg-red-100 text-red-800 border-red-200';
                if (q.frequencyValue === 2) freqColor = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                if (q.frequencyValue === 1) freqColor = 'bg-gray-100 text-gray-800 border-gray-200';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow';
                card.innerHTML = `
                    <div class="p-5 md:p-6">
                        <div class="flex flex-wrap items-center gap-2 mb-4">
                            <span class="px-2.5 py-1 bg-blue-600 text-white text-xs font-bold rounded">
                                ${q.year} 年度
                            </span>
                            <span class="px-2.5 py-1 bg-gray-200 text-gray-700 text-xs font-semibold rounded">
                                第 ${q.no} 題
                            </span>
                            <span class="px-2.5 py-1 border text-xs font-semibold rounded ${freqColor}">
                                頻率: ${q.frequencyLabel}
                            </span>
                            <span class="px-2.5 py-1 bg-purple-100 text-purple-800 border border-purple-200 text-xs font-semibold rounded ml-auto">
                                ${q.category}
                            </span>
                        </div>
                        
                        <h3 class="text-lg font-medium text-gray-900 mb-4 leading-relaxed">
                            ${q.question}
                        </h3>
                        
                        <div class="space-y-2 mb-4 ml-2">
                            ${q.options.map(opt => `<div class="text-gray-700">${opt}</div>`).join('')}
                        </div>
                        
                        <button onclick="toggleAnswer(${q.id})" class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            <span id="btn-text-${q.id}">顯示解答與解析</span>
                        </button>
                        
                        <div id="ans-${q.id}" class="answer-reveal">
                            <div class="bg-blue-50 p-4 rounded-lg">
                                <div class="font-bold text-blue-900 mb-1">正確答案：${q.answer}</div>
                                <div class="text-blue-800 text-sm leading-relaxed">
                                    <span class="font-semibold">解析：</span>${q.explanation}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            // 如果當前狀態是全部展開，則讓新渲染的元素也展開
            if (allExpanded) {
                document.querySelectorAll('.answer-reveal').forEach(el => el.classList.add('show'));
                document.querySelectorAll('[id^="btn-text-"]').forEach(el => el.innerText = '隱藏解答與解析');
            }
        }

        // 單題展開/隱藏邏輯
        window.toggleAnswer = function(id) {
            const ansDiv = document.getElementById(`ans-${id}`);
            const btnText = document.getElementById(`btn-text-${id}`);
            
            if (ansDiv.classList.contains('show')) {
                ansDiv.classList.remove('show');
                btnText.innerText = '顯示解答與解析';
            } else {
                ansDiv.classList.add('show');
                btnText.innerText = '隱藏解答與解析';
            }
        };

        // 全部展開/隱藏邏輯
        expandAllBtn.addEventListener('click', () => {
            allExpanded = !allExpanded;
            const ansDivs = document.querySelectorAll('.answer-reveal');
            const btnTexts = document.querySelectorAll('[id^="btn-text-"]');
            
            if (allExpanded) {
                ansDivs.forEach(div => div.classList.add('show'));
                btnTexts.forEach(btn => btn.innerText = '隱藏解答與解析');
                expandAllBtn.innerText = '隱藏全部解析';
                expandAllBtn.classList.replace('bg-blue-100', 'bg-gray-200');
                expandAllBtn.classList.replace('text-blue-700', 'text-gray-800');
            } else {
                ansDivs.forEach(div => div.classList.remove('show'));
                btnTexts.forEach(btn => btn.innerText = '顯示解答與解析');
                expandAllBtn.innerText = '展開全部解析';
                expandAllBtn.classList.replace('bg-gray-200', 'bg-blue-100');
                expandAllBtn.classList.replace('text-gray-800', 'text-blue-700');
            }
        });

        // 綁定事件監聽
        sortSelect.addEventListener('change', renderQuestions);
        filterSelect.addEventListener('change', renderQuestions);

        // 初始化渲染
        renderQuestions();
    </script>
</body>
</html>
